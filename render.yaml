# Конфигурация Render для статического сайта.
# Собирать нечего: это чистые HTML/CSS/JS без сборщика,
# публикуется корень репозитория как есть.

services:
  - type: web
    name: kogane
    runtime: static

    # Сборки нет — команда пустая
    buildCommand: ""

    # Корень репозитория: index.html лежит прямо в нём
    staticPublishPath: .

    pullRequestPreviewsEnabled: false

    headers:
      # Ничего не держим в кеше без проверки: браузер обязан спросить сервер,
      # изменился ли файл. Иначе старый модуль из кеша встречается с новой
      # разметкой — и интерфейс ведёт себя необъяснимо.
      # Файлы маленькие, ответ 304 почти ничего не стоит.
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
